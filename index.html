const VIDEO_TOKEN="assets/c334a74723e0.mp4";
const NAMES={home:'Home','about-us':'About Us',services:'Services','our-process':'Our Process',contact:'Contact'};
const FILES={'index.html':'home','about-us.html':'about-us','services.html':'services','our-process.html':'our-process','contact.html':'contact'};
const frame=document.getElementById('frame');
const urls={};
function b2u(b64){const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
for(const k in ASSETS){urls[k]=URL.createObjectURL(new Blob([b2u(ASSETS[k][1])],{type:ASSETS[k][0]}));}
urls[VIDEO_TOKEN]=new URL('hero.mp4',location.href).href;
const cache={};
function pageUrl(key){
  if(cache[key])return cache[key];
  let h=PAGES[key];
  for(const t in urls)h=h.split(t).join(urls[t]);
  return cache[key]=URL.createObjectURL(new Blob([h],{type:'text/html'}));
}
let current=null,first=true;
function navigate(key,push){
  if(!PAGES[key])key='home';
  if(key===current)return;
  current=key;
  document.title='LaunchLoop - '+NAMES[key];
  const hash=key==='home'?'':'#'+key;
  if(push!==false)history.pushState(null,'',location.pathname+location.search+hash);
  const u=pageUrl(key);
  if(first){first=false;frame.src=u;}else{try{frame.contentWindow.location.replace(u);}catch(e){frame.src=u;}}
}
function keyFromHash(){const k=decodeURIComponent(location.hash.slice(1));return PAGES[k]?k:'home';}
frame.addEventListener('load',()=>{
  let doc;try{doc=frame.contentDocument;}catch(e){return;}
  if(!doc)return;
  doc.addEventListener('click',e=>{
    const a=e.target.closest&&e.target.closest('a[href]');if(!a)return;
    const href=a.getAttribute('href')||'';
    const m=href.match(/(^|\/)(index|about-us|services|our-process|contact)\.html(#.*)?$/);
    if(m){e.preventDefault();navigate(FILES[m[2]+'.html']);return;}
    if(/^https?:/i.test(href)){e.preventDefault();window.open(href,'_blank','noopener');}
  },true);
});
window.addEventListener('popstate',()=>navigate(keyFromHash(),false));
navigate(keyFromHash(),false);
</script>
